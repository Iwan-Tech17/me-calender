<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Professional Mobile Calendar</title>
    
    <!-- PWA Manifest & Theme Color -->
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22Professional%20Calendar%22%2C%22short_name%22%3A%22Calendar%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f3f4f6%22%2C%22theme_color%22%3A%22%232563eb%22%2C%22icons%22%3A%5B%5D%7D">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }

        /* Smooth slide-up animation for mobile bottom sheets */
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-slide-up {
            animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Prevent text selection during touch drags */
        .no-select {
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body class="h-full flex flex-col text-slate-800 antialiased overflow-hidden">

    <!-- Mobile Header -->
    <header class="bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between z-10 shrink-0 shadow-xs">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-md shadow-blue-500/20">
                <i class="fa-solid fa-calendar-days text-base"></i>
            </div>
            <div>
                <h1 id="header-month-title" class="text-lg font-bold text-slate-900 leading-tight">Loading...</h1>
                <p id="header-subtitle" class="text-xs text-slate-500 font-medium">Monday – Sunday View</p>
            </div>
        </div>

        <div class="flex items-center space-x-1">
            <button id="btn-today" class="px-3 py-1.5 text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg transition active:scale-95">
                Today
            </button>
            <div class="flex items-center bg-slate-100 rounded-lg p-0.5 ml-1">
                <button id="btn-prev" class="w-8 h-8 flex items-center justify-center text-slate-600 hover:text-slate-900 rounded-md transition active:scale-95">
                    <i class="fa-solid fa-chevron-left text-xs"></i>
                </button>
                <button id="btn-next" class="w-8 h-8 flex items-center justify-center text-slate-600 hover:text-slate-900 rounded-md transition active:scale-95">
                    <i class="fa-solid fa-chevron-right text-xs"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Weekdays Header Row (Mon to Sun) -->
    <div class="bg-slate-50 border-b border-slate-200 grid grid-cols-7 text-center shrink-0 text-xs font-semibold text-slate-500 uppercase tracking-wider py-2 no-select">
        <div>Mon</div>
        <div>Tue</div>
        <div>Wed</div>
        <div>Thu</div>
        <div>Fri</div>
        <div class="text-amber-600 bg-amber-50/50">Sat</div>
        <div class="text-amber-600 bg-amber-50/50">Sun</div>
    </div>

    <!-- Main Scrollable Weekly Grid Area -->
    <main id="calendar-container" class="flex-1 overflow-y-auto bg-slate-100/50 divide-y divide-slate-200 pb-20">
        <!-- Weekly rows generated dynamically via JS -->
    </main>

    <!-- Bottom Sheet Modal for Adding/Viewing Entries -->
    <div id="event-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs hidden z-50 flex flex-col justify-end transition-opacity opacity-0">
        <div id="modal-card" class="bg-white rounded-t-2xl shadow-2xl w-full max-w-lg mx-auto transform translate-y-full transition-transform duration-300 flex flex-col max-h-[90vh]">
            <!-- Modal Handle & Header -->
            <div class="p-4 border-b border-slate-100 flex items-center justify-between shrink-0">
                <div>
                    <h3 id="modal-date-title" class="text-base font-bold text-slate-900">Add Entry</h3>
                    <p id="modal-date-subtitle" class="text-xs text-slate-500">Select type and provide details</p>
                </div>
                <button id="btn-close-modal" class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:bg-slate-200 transition">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
            </div>

            <!-- Modal Form Body -->
            <div class="p-4 space-y-4 overflow-y-auto flex-1">
                <input type="hidden" id="modal-input-date">

                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Entry Title</label>
                    <input type="text" id="event-title-input" placeholder="e.g. Project Milestone, Holiday, Doctor" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 text-sm transition">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Category / Type</label>
                    <div class="grid grid-cols-2 gap-2">
                        <label class="flex items-center space-x-2 p-3 rounded-xl border border-slate-200 bg-slate-50 cursor-pointer hover:border-blue-500 transition has-[:checked]:border-blue-600 has-[:checked]:bg-blue-50/50">
                            <input type="radio" name="event-type" value="Task" checked class="text-blue-600 focus:ring-blue-500">
                            <span class="text-xs font-medium text-slate-700 flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-blue-500"></span> Task</span>
                        </label>
                        <label class="flex items-center space-x-2 p-3 rounded-xl border border-slate-200 bg-slate-50 cursor-pointer hover:border-purple-500 transition has-[:checked]:border-purple-600 has-[:checked]:bg-purple-50/50">
                            <input type="radio" name="event-type" value="Appointment" class="text-purple-600 focus:ring-purple-500">
                            <span class="text-xs font-medium text-slate-700 flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-purple-500"></span> Appointment</span>
                        </label>
                        <label class="flex items-center space-x-2 p-3 rounded-xl border border-slate-200 bg-slate-50 cursor-pointer hover:border-amber-500 transition has-[:checked]:border-amber-600 has-[:checked]:bg-amber-50/50">
                            <input type="radio" name="event-type" value="Event" class="text-amber-600 focus:ring-amber-500">
                            <span class="text-xs font-medium text-slate-700 flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-amber-500"></span> Event</span>
                        </label>
                        <label class="flex items-center space-x-2 p-3 rounded-xl border border-slate-200 bg-slate-50 cursor-pointer hover:border-emerald-500 transition has-[:checked]:border-emerald-600 has-[:checked]:bg-emerald-50/50">
                            <input type="radio" name="event-type" value="Holiday" class="text-emerald-600 focus:ring-emerald-500">
                            <span class="text-xs font-medium text-slate-700 flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-emerald-500"></span> Holiday</span>
                        </label>
                    </div>
                </div>

                <!-- Existing entries for this date -->
                <div class="pt-2">
                    <h4 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Existing Entries on this Day</h4>
                    <div id="modal-existing-list" class="space-y-2">
                        <!-- Populated dynamically -->
                    </div>
                </div>
            </div>

            <!-- Modal Footer Actions -->
            <div class="p-4 border-t border-slate-100 bg-slate-50 flex items-center gap-3 shrink-0">
                <button id="btn-cancel-modal" class="w-1/2 py-3 px-4 rounded-xl border border-slate-200 font-semibold text-slate-600 text-sm hover:bg-slate-100 transition">Cancel</button>
                <button id="btn-save-event" class="w-1/2 py-3 px-4 rounded-xl bg-blue-600 text-white font-semibold text-sm shadow-lg shadow-blue-500/25 hover:bg-blue-700 transition">Save Entry</button>
            </div>
        </div>
    </div>

    <!-- Application Logic -->
    <script>
        // State Management
        let viewDate = new Date(); // Current anchor date for view
        let events = {}; // Format: { "YYYY-MM-DD": [ { id, title, type }, ... ] }

        // Load data from localStorage on start
        function loadEvents() {
            try {
                const stored = localStorage.getItem('pro_calendar_events_v2');
                if (stored) {
                    events = JSON.parse(stored);
                }
            } catch (err) {
                console.error("Failed to load events from storage", err);
                events = {};
            }
        }

        // Save data to localStorage
        function saveEvents() {
            try {
                localStorage.setItem('pro_calendar_events_v2', JSON.stringify(events));
            } catch (err) {
                console.error("Failed to save events", err);
            }
        }

        // DOM Elements
        const calendarContainer = document.getElementById('calendar-container');
        const headerMonthTitle = document.getElementById('header-month-title');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const btnToday = document.getElementById('btn-today');

        // Modal Elements
        const eventModal = document.getElementById('event-modal');
        const modalCard = document.getElementById('modal-card');
        const modalInputDate = document.getElementById('modal-input-date');
        const eventTitleInput = document.getElementById('event-title-input');
        const modalDateTitle = document.getElementById('modal-date-title');
        const modalDateSubtitle = document.getElementById('modal-date-subtitle');
        const modalExistingList = document.getElementById('modal-existing-list');
        const btnCloseModal = document.getElementById('btn-close-modal');
        const btnCancelModal = document.getElementById('btn-cancel-modal');
        const btnSaveEvent = document.getElementById('btn-save-event');

        // Render Calendar (Weekly Rows where Mon-Sun order is strictly maintained)
        function renderCalendar() {
            calendarContainer.innerHTML = '';

            const year = viewDate.getFullYear();
            const month = viewDate.getMonth();

            // Set Header Title
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            headerMonthTitle.textContent = `${monthNames[month]} ${year}`;

            // Calculate start date of the view grid (First Monday of or preceding the 1st of the month)
            const firstDayOfMonth = new Date(year, month, 1);
            let dayOfWeek = firstDayOfMonth.getDay() - 1; // Mon=0, ..., Sun=6
            if (dayOfWeek === -1) dayOfWeek = 6; // Sunday fix

            const startDate = new Date(year, month, 1 - dayOfWeek);
            
            // Calculate total days to render (approx 5-6 weeks to cover the month fully)
            const lastDayOfMonth = new Date(year, month + 1, 0);
            const totalDaysInMonthSpan = lastDayOfMonth.getDate() + dayOfWeek;
            const totalWeeks = Math.ceil(totalDaysInMonthSpan / 7);

            let iteratorDate = new Date(startDate);
            const todayStr = formatDateKey(new Date());

            for (let w = 0; w < Math.max(totalWeeks, 5); w++) {
                const weekRow = document.createElement('div');
                weekRow.className = 'grid grid-cols-7 bg-white min-h-[110px] divide-x divide-slate-100 border-b border-slate-200';

                for (let d = 0; d < 7; d++) {
                    const currentDate = new Date(iteratorDate);
                    const dateKey = formatDateKey(currentDate);
                    const isCurrentMonth = currentDate.getMonth() === month;
                    const isToday = (dateKey === todayStr);

                    // Determine weekend (Saturday=5, Sunday=6 in Mon-Sun indexing)
                    const isWeekend = (d === 5 || d === 6);

                    // Check for holidays or custom events
                    const dayEvents = events[dateKey] || [];
                    const hasHoliday = dayEvents.some(e => e.type === 'Holiday');

                    // Determine cell background styling based on rules:
                    // Holiday -> Green
                    // Weekend -> Yellow
                    // Normal -> Neutral / White
                    let cellBg = 'bg-white hover:bg-slate-50';
                    let numColor = 'text-slate-700';

                    if (hasHoliday) {
                        cellBg = 'bg-emerald-50/80 hover:bg-emerald-100/80 border-t-2 border-emerald-500';
                        numColor = 'text-emerald-900 font-bold';
                    } else if (isWeekend) {
                        cellBg = 'bg-amber-50/60 hover:bg-amber-100/60';
                        numColor = 'text-amber-900 font-semibold';
                    }

                    if (!isCurrentMonth) {
                        cellBg = 'bg-slate-50/40 opacity-40';
                    }

                    const cellDiv = document.createElement('div');
                    cellDiv.className = `p-1.5 sm:p-2 flex flex-col cursor-pointer transition relative group ${cellBg}`;
                    cellDiv.setAttribute('data-date', dateKey);

                    // Day Header inside cell
                    let dayNumHtml = `<span class="inline-flex items-center justify-center w-6 h-6 text-xs rounded-full ${isToday ? 'bg-blue-600 text-white font-bold shadow-sm' : numColor}">${currentDate.getDate()}</span>`;

                    // Render event pills
                    let eventsHtml = '';
                    dayEvents.forEach(ev => {
                        let pillClass = 'bg-blue-100 text-blue-700 border-l-2 border-blue-500';
                        if (ev.type === 'Appointment') pillClass = 'bg-purple-100 text-purple-700 border-l-2 border-purple-500';
                        if (ev.type === 'Event') pillClass = 'bg-amber-100 text-amber-700 border-l-2 border-amber-500';
                        if (ev.type === 'Holiday') pillClass = 'bg-emerald-600 text-white shadow-xs font-medium';

                        eventsHtml += `
                            <div class="text-[10px] leading-tight px-1.5 py-0.5 rounded truncate ${pillClass} my-0.5 flex items-center justify-between">
                                <span class="truncate">${escapeHtml(ev.title)}</span>
                            </div>
                        `;
                    });

                    cellDiv.innerHTML = `
                        <div class="flex items-center justify-between mb-1">
                            ${dayNumHtml}
                            <span class="text-[10px] text-slate-400 opacity-0 group-hover:opacity-100 transition"><i class="fa-solid fa-plus"></i></span>
                        </div>
                        <div class="flex-1 overflow-hidden space-y-0.5">
                            ${eventsHtml}
                        </div>
                    `;

                    // Click handler to open modal for this specific date
                    cellDiv.addEventListener('click', () => {
                        openModal(dateKey, currentDate);
                    });

                    weekRow.appendChild(cellDiv);
                    iteratorDate.setDate(iteratorDate.getDate() + 1);
                }

                calendarContainer.appendChild(weekRow);
            }
        }

        function formatDateKey(dateObj) {
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Modal Management
        function openModal(dateKey, dateObj) {
            modalInputDate.value = dateKey;
            eventTitleInput.value = '';

            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            modalDateTitle.textContent = dateObj.toLocaleDateString('en-US', options);
            modalDateSubtitle.textContent = `Manage tasks, appointments, events & holidays`;

            renderExistingEntriesInModal(dateKey);

            eventModal.classList.remove('hidden');
            setTimeout(() => {
                eventModal.classList.remove('opacity-0');
                modalCard.classList.remove('translate-y-full');
            }, 10);

            setTimeout(() => eventTitleInput.focus(), 200);
        }

        function closeModal() {
            eventModal.classList.add('opacity-0');
            modalCard.classList.add('translate-y-full');
            setTimeout(() => {
                eventModal.classList.add('hidden');
            }, 300);
        }

        function renderExistingEntriesInModal(dateKey) {
            const dayEvents = events[dateKey] || [];
            if (dayEvents.length === 0) {
                modalExistingList.innerHTML = `<p class="text-xs text-slate-400 italic py-1">No entries recorded for this date yet.</p>`;
                return;
            }

            modalExistingList.innerHTML = dayEvents.map(ev => `
                <div class="flex items-center justify-between p-2.5 bg-slate-50 border border-slate-100 rounded-xl text-xs">
                    <div class="flex items-center space-x-2 truncate">
                        <span class="w-2 h-2 rounded-full ${ev.type === 'Holiday' ? 'bg-emerald-500' : ev.type === 'Appointment' ? 'bg-purple-500' : ev.type === 'Event' ? 'bg-amber-500' : 'bg-blue-500'}"></span>
                        <span class="font-medium text-slate-700 truncate">${escapeHtml(ev.title)}</span>
                        <span class="text-[10px] text-slate-400 bg-slate-200/60 px-1.5 py-0.5 rounded">${ev.type}</span>
                    </div>
                    <button onclick="deleteEvent('${dateKey}', '${ev.id}')" class="text-slate-400 hover:text-rose-600 p-1 transition">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>
            `).join('');
        }

        window.deleteEvent = function(dateKey, eventId) {
            if (events[dateKey]) {
                events[dateKey] = events[dateKey].filter(e => e.id !== eventId);
                if (events[dateKey].length === 0) delete events[dateKey];
                saveEvents();
                renderCalendar();
                renderExistingEntriesInModal(dateKey);
            }
        };

        // Navigation Buttons
        btnPrev.addEventListener('click', () => {
            viewDate.setMonth(viewDate.getMonth() - 1);
            renderCalendar();
        });

        btnNext.addEventListener('click', () => {
            viewDate.setMonth(viewDate.getMonth() + 1);
            renderCalendar();
        });

        btnToday.addEventListener('click', () => {
            viewDate = new Date();
            renderCalendar();
        });

        // Modal triggers
        btnCloseModal.addEventListener('click', closeModal);
        btnCancelModal.addEventListener('click', closeModal);
        eventModal.addEventListener('click', (e) => {
            if (e.target === eventModal) closeModal();
        });

        // Save Event Trigger
        btnSaveEvent.addEventListener('click', () => {
            const dateKey = modalInputDate.value;
            const title = eventTitleInput.value.trim();
            const selectedType = document.querySelector('input[name="event-type"]:checked').value;

            if (!title) {
                eventTitleInput.classList.add('border-rose-500', 'ring-2', 'ring-rose-500/20');
                setTimeout(() => eventTitleInput.classList.remove('border-rose-500', 'ring-2', 'ring-rose-500/20'), 1500);
                return;
            }

            if (!events[dateKey]) {
                events[dateKey] = [];
            }

            events[dateKey].push({
                id: 'ev_' + Date.now() + Math.random().toString(36).substr(2, 5),
                title,
                type: selectedType
            });

            saveEvents();
            renderCalendar();
            closeModal();
        });

        // Register Service Worker for PWA Offline Support
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swCode = `
                    self.addEventListener('install', (e) => { self.skipWaiting(); });
                    self.addEventListener('activate', (e) => { clients.claim(); });
                    self.addEventListener('fetch', (e) => { e.respondWith(fetch(e.request).catch(() => caches.match(e.request))); });
                `;
                const blob = new Blob([swCode], { type: 'text/javascript' });
                const swUrl = URL.createObjectURL(blob);
                navigator.serviceWorker.register(swUrl).catch(err => console.log('SW registration failed', err));
            });
        }

        // Initial Initialization
        loadEvents();
        renderCalendar();
    </script>
</body>
</html>
